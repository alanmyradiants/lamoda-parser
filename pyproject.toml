[project]
name = "lamoda-parser"
version = "0.1.0"
description = "Внешняя аналитика Lamoda: снимки каталога, остатки, расчёт продаж"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "playwright>=1.45",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
pg = ["psycopg[binary]>=3.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lamoda_parser*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
